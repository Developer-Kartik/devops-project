name: First CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  first-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project
        run: echo "Hello Kartik! CI Pipeline is running."

      - name: Check README
        run: test -f README.md
